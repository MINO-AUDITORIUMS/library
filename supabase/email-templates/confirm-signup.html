<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #fafafa; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            style="
              max-width: 480px;
              background: #ffffff;
              border-radius: 12px;
              border: 1px solid #e5e5e5;
              padding: 40px 32px;
            "
          >
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <img
                  src="https://kggtjvrwvdjtzqjghnel.supabase.co/storage/v1/object/public/mino-assets/brand/Pictogramme_Mino_Alter1_Black.png"
                  alt="MINO"
                  width="48"
                  height="48"
                  style="display: block"
                />
                <p
                  style="
                    margin: 12px 0 0;
                    font-size: 11px;
                    letter-spacing: 0.2em;
                    color: #737373;
                    text-transform: uppercase;
                  "
                >
                  Library
                </p>
              </td>
            </tr>
            <tr>
              <td>
                <h1
                  style="
                    margin: 0 0 8px;
                    font-size: 20px;
                    font-weight: 600;
                    color: #0a0a0a;
                    text-align: center;
                  "
                >
                  Active ton compte
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 14px;
                    color: #737373;
                    text-align: center;
                    line-height: 1.5;
                  "
                >
                  Bienvenue sur MINO Library.<br />
                  Clique sur le bouton pour confirmer ton adresse email et
                  finaliser la création de ton compte.
                </p>
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          background: #0a0a0a;
                          color: #ffffff;
                          text-decoration: none;
                          font-size: 14px;
                          font-weight: 500;
                          padding: 12px 32px;
                          border-radius: 8px;
                        "
                      >
                        Confirmer mon email
                      </a>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 12px;
                    color: #a3a3a3;
                    text-align: center;
                    line-height: 1.5;
                  "
                >
                  Si tu n'as pas demandé la création de ce compte, ignore cet
                  email.<br />
                  Destinataire : {{ .Email }}
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 16px 0 0; font-size: 11px; color: #a3a3a3">
            © MINO · mino.co
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
