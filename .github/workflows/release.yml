name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.skip != 'true' }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide bump type
        id: bump
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%s)"
          echo "head_message=$msg" >> "$GITHUB_OUTPUT"

          if [[ "$msg" == chore\(release\):* ]] || [[ "$msg" == chore\(release\)* ]] || [[ "$msg" == "chore: release"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$msg" == fix:* ]]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "type=minor" >> "$GITHUB_OUTPUT"

      - name: Bump version, tag, push
        id: version
        if: ${{ steps.bump.outputs.skip != 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          bump="${{ steps.bump.outputs.type }}"
          npm version "$bump" -m "chore(release): %s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

          git push --follow-tags

  deploy:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    secrets: inherit

